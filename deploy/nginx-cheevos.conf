# Reverse-proxy snippet for Cheevos. Drop this inside an existing `server { }`
# block (e.g. in /etc/nginx/sites-available/default), then `sudo nginx -t` and
# `sudo systemctl reload nginx`.
#
# The Node app is itself mounted at the /cheevos base path, so we proxy_pass
# WITHOUT a trailing path to preserve the /cheevos/ prefix in the forwarded URI.
# (Do NOT use `proxy_pass http://127.0.0.1:3000/;` with a trailing slash — that
#  strips /cheevos/ and the app would 404.)

location = /cheevos {
    return 301 /cheevos/;
}

location /cheevos/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
