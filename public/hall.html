<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheevos — Hall of Fame</title>
  <link rel="icon" href="icons/coin.svg" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1 data-app-title>Cheevos</h1>
    </div>
    <nav class="nav">
      <a href="index.html" data-nav="board">Quest Board</a>
      <a href="rewards.html" data-nav="vault">Treasure Vault</a>
      <a href="hall.html" data-nav="hall">Hall of Fame</a>
    </nav>
    <a class="parents-link" href="admin.html">⚙ Parents</a>
    <div class="gold-badge" id="gold-badge" title="Your gold">
      <img class="coin" src="icons/coin.svg" alt="gold" />
      <span id="gold-value">0</span>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-title">Hall of Fame</h2>
    <p class="section-sub">Every quest you've conquered. Well done, hero!</p>
    <section id="hall" class="card-grid trophies" aria-live="polite"></section>
    <p id="empty" class="empty hidden">No trophies yet — go complete a quest!</p>
  </main>

  <script type="module" src="js/hall.js"></script>
</body>
</html>
